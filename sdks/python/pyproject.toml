[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firm-sdk"
version = "1.0.0"
description = "Python SDK for the Firm Ecosystem MCP server — typed client for 138 AI agent tools"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Romain Santoli", email = "romainsantoli@gmail.com"},
]
keywords = ["mcp", "ai-agents", "firm", "sdk", "hebbian-memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
async = ["aiohttp>=3.9.0"]

[project.urls]
Homepage = "https://github.com/romainsantoli-web/firm-ecosystem"
Repository = "https://github.com/romainsantoli-web/setup-vs-agent-firm"

[tool.setuptools.packages.find]
include = ["firm_sdk*"]
