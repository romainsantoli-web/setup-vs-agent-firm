# Publish firm-cli to PyPI on release tag
# Note: mcp-openclaw-extensions is published from its own repo
# (https://github.com/romainsantoli-web/mcp-openclaw)
name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-cli:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build firm-cli
        working-directory: firm-cli
        run: python -m build

      - name: Publish firm-cli
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: firm-cli/dist/
