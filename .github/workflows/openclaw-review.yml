name: Firm AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["main", "develop"]

permissions:
  contents: read
  pull-requests: write

jobs:
  firm-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_VERSION: "3.11"
      MCP_EXT_PORT: "8012"
      MCP_EXT_HOST: "127.0.0.1"

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Collect diff ────────────────────────────────────────────────────
      - name: Collect diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD \
            --diff-filter=ACMR --stat > diff_stat.txt
          git diff origin/${{ github.base_ref }}...HEAD \
            --diff-filter=ACMR \
            -- '*.py' '*.ts' '*.js' '*.sh' '*.md' '*.yaml' '*.yml' \
            | head -c 32000 > diff_patch.txt
          echo "stat<<EOF" >> "$GITHUB_OUTPUT"
          cat diff_stat.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # ── 3. Python + MCP server (cloned from separate repo) ─────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Clone and install mcp-openclaw
        run: |
          git clone --depth 1 https://github.com/romainsantoli-web/mcp-openclaw.git mcp-openclaw-extensions
          pip install -r mcp-openclaw-extensions/requirements.txt

      - name: Start MCP server
        env:
          FIRM_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MCP_EXT_HOST: ${{ env.MCP_EXT_HOST }}
          MCP_EXT_PORT: ${{ env.MCP_EXT_PORT }}
        working-directory: mcp-openclaw-extensions
        run: |
          nohup python -m src.main > /tmp/mcp_ext.log 2>&1 &
          echo $! > /tmp/mcp_ext.pid
          for i in $(seq 1 30); do
            if curl -sf -X POST http://$MCP_EXT_HOST:$MCP_EXT_PORT/mcp \
                -H "Content-Type: application/json" \
                -d '{"jsonrpc":"2.0","id":0,"method":"ping"}' | grep -q '"result"'; then
              echo "MCP server ready after ${i}s"
              break
            fi
            sleep 1
          done

      # ── 4. Quality review via MCP ──────────────────────────────────────────
      - name: Firm Quality department review
        id: review
        env:
          FIRM_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          MCP_EXT_HOST: ${{ env.MCP_EXT_HOST }}
          MCP_EXT_PORT: ${{ env.MCP_EXT_PORT }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          python3 - <<'PYEOF'
          import asyncio, httpx, json, os, sys, pathlib

          MCP = f"http://{os.environ['MCP_EXT_HOST']}:{os.environ['MCP_EXT_PORT']}/mcp"
          PR_TITLE  = os.environ.get("PR_TITLE", "")
          PR_BODY   = os.environ.get("PR_BODY", "")
          DIFF_STAT = pathlib.Path("diff_stat.txt").read_text(errors="replace")[:2000]
          DIFF_PATCH = pathlib.Path("diff_patch.txt").read_text(errors="replace")

          QUALITY_PROMPT = f"""
          You are the Quality department (QA Lead + Code Reviewer + Security Auditor) of a
          software firm agent pyramid.

          ## Pull Request
          Title : {PR_TITLE}
          Body  : {PR_BODY}

          ## Files changed
          {DIFF_STAT}

          ## Diff (truncated to 32KB)
          ```
          {DIFF_PATCH}
          ```

          ## Review tasks
          1. **Code quality** — style, naming, complexity, dead code.
          2. **Security** — secrets in code, injection risks, auth issues, OWASP Top-10.
          3. **Test coverage** — missing tests for new code paths.
          4. **Documentation** — missing docstrings, README gaps.
          5. **CI/CD impact** — breaking changes, migrations needed.

          Reply with a structured Markdown report:
          - overall verdict: APPROVE / REQUEST_CHANGES / COMMENT
          - severity table (Critical / High / Medium / Low counts)
          - findings list (each: severity, file:line, description, suggested fix)
          - summary paragraph (max 120 words)

          ⚠️ This is an AI review. A human reviewer must validate before merge.
          """.strip()

          async def run():
              async with httpx.AsyncClient(timeout=120) as client:
                  resp = await client.post(MCP, json={
                      "jsonrpc": "2.0", "id": 1, "method": "tools/call",
                      "params": {
                          "name": "firm_export_document",
                          "arguments": {
                              "objective": f"Quality review: {PR_TITLE}",
                              "content": QUALITY_PROMPT,
                              "departments": ["quality"],
                              "metadata": {
                                  "pr_number": os.environ.get("PR_NUMBER", ""),
                                  "pr_sha": os.environ.get("PR_SHA", ""),
                                  "base_ref": os.environ.get("BASE_REF", ""),
                              }
                          }
                      }
                  })
                  data = resp.json()
                  result = data.get("result", {})
                  doc_path = result.get("path", "")

                  gw = os.environ.get("FIRM_GATEWAY_URL", "")
                  review_result = ""
                  if gw:
                      try:
                          import websockets
                          async with websockets.connect(gw, open_timeout=10) as ws:
                              await ws.send(json.dumps({
                                  "jsonrpc": "2.0", "id": 2, "method": "agent.send",
                                  "params": {
                                      "agent": "quality-lead",
                                      "message": QUALITY_PROMPT,
                                      "metadata": {"source": "ci-review", "pr_number": os.environ.get("PR_NUMBER", "")}
                                  }
                              }))
                              raw = await asyncio.wait_for(ws.recv(), timeout=60)
                              resp_ws = json.loads(raw)
                              review_result = resp_ws.get("result", {}).get("content", "")
                      except Exception as e:
                          review_result = (
                              f"_Firm Gateway unavailable ({e}). "
                              f"Static review prompt saved to `{doc_path}`._\n\n"
                              f"**Diff statistics:**\n```\n{DIFF_STAT}\n```"
                          )
                  else:
                      review_result = (
                          f"_FIRM_GATEWAY_URL not configured. "
                          f"Review prompt saved to `{doc_path}`._\n\n"
                          f"**Diff statistics:**\n```\n{DIFF_STAT}\n```"
                      )

                  pathlib.Path("review_result.md").write_text(review_result)
                  print("Review result written to review_result.md")

          asyncio.run(run())
          PYEOF

      # ── 5. Post PR comment ─────────────────────────────────────────────────
      - name: Post review comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let body;
            try {
              body = fs.readFileSync('review_result.md', 'utf8');
            } catch {
              body = '_Firm review did not produce output. Check CI logs._';
            }

            const header = `## 🧠 Firm Quality Review\n\n` +
              `> **AI-generated review** — requires human validation before merge.\n\n`;

            const footer = `\n\n---\n_Generated by [firm-mcp-server](https://github.com/romainsantoli-web/mcp-openclaw) · ` +
              `Commit \`${{ github.event.pull_request.head.sha }}\`_`;

            const fullBody = header + body + footer;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('Firm Quality Review')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: fullBody,
              });
            }

      # ── 6. Stop MCP server ─────────────────────────────────────────────────
      - name: Stop MCP server
        if: always()
        run: |
          [[ -f /tmp/mcp_ext.pid ]] && kill $(cat /tmp/mcp_ext.pid) 2>/dev/null || true
          echo "=== MCP server logs ===" && cat /tmp/mcp_ext.log || true
