# Auto-generate tool reference documentation from source code
name: Docs Sync

on:
  push:
    branches: [main]
    paths:
      - "mcp-openclaw-extensions/src/**"
      - "firm-cli/firm_cli/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r mcp-openclaw-extensions/requirements.txt
          pip install -e firm-cli

      - name: Generate tool reference
        run: python scripts/generate-tool-docs.py

      - name: Check for changes
        id: check
        run: |
          git diff --quiet docs/ && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit updated docs
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "docs: auto-sync tool reference from source"
          git push
