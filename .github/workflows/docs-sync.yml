# Auto-generate tool reference documentation from source code
# + cross-repo README sync from 3 external repositories
name: Docs Sync

on:
  push:
    branches: [main]
    paths:
      - "mcp-openclaw-extensions/src/**"
      - "firm-cli/firm_cli/**"
      - "scripts/generate-tool-docs.py"
  schedule:
    # Sync cross-repo docs daily at 6am UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r mcp-openclaw-extensions/requirements.txt
          pip install -e firm-cli

      - name: Generate tool reference
        run: python scripts/generate-tool-docs.py

      - name: Pull cross-repo docs
        run: |
          mkdir -p docs/repos

          # mcp-openclaw-extensions
          curl -sL "https://raw.githubusercontent.com/romainsantoli-web/mcp-openclaw-extensions/main/README.md" \
            -o docs/repos/mcp-openclaw-extensions.md 2>/dev/null || echo "# mcp-openclaw-extensions\n\n> Could not fetch README." > docs/repos/mcp-openclaw-extensions.md

          # Memory-os-ai
          curl -sL "https://raw.githubusercontent.com/romainsantoli-web/Memory-os-ai/main/README.md" \
            -o docs/repos/memory-os-ai.md 2>/dev/null || echo "# Memory-os-ai\n\n> Could not fetch README." > docs/repos/memory-os-ai.md

          # setup-vs-agent-firm (parent repo)
          curl -sL "https://raw.githubusercontent.com/romainsantoli-web/setup-vs-agent-firm/main/README.md" \
            -o docs/repos/setup-vs-agent-firm.md 2>/dev/null || echo "# setup-vs-agent-firm\n\n> Could not fetch README." > docs/repos/setup-vs-agent-firm.md

      - name: Generate ecosystem stats
        run: |
          python3 - <<'PYEOF'
          import json, pathlib, datetime

          stats = {
              "generated_at": datetime.datetime.utcnow().isoformat() + "Z",
              "repos": {
                  "mcp-openclaw-extensions": {"synced": pathlib.Path("docs/repos/mcp-openclaw-extensions.md").exists()},
                  "memory-os-ai":            {"synced": pathlib.Path("docs/repos/memory-os-ai.md").exists()},
                  "setup-vs-agent-firm":     {"synced": pathlib.Path("docs/repos/setup-vs-agent-firm.md").exists()},
              },
          }
          # Count tools from generated docs
          tool_ref = pathlib.Path("docs/tool-reference.md")
          if tool_ref.exists():
              text = tool_ref.read_text()
              tools_count = text.count("### `")
              stats["tools_count"] = tools_count

          # Count skills
          skills_dir = pathlib.Path("skills")
          if skills_dir.exists():
              stats["skills_count"] = len([d for d in skills_dir.iterdir() if d.is_dir()])

          pathlib.Path("docs/ecosystem-stats.json").write_text(json.dumps(stats, indent=2) + "\n")
          print(f"Stats generated: {json.dumps(stats, indent=2)}")
          PYEOF

      - name: Check for changes
        id: check
        run: |
          git diff --quiet docs/ && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit updated docs
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "docs: auto-sync tool reference + cross-repo READMEs"
          git push
