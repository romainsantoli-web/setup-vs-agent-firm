# CI — run firm-cli tests on every PR and push to main
# Note: mcp-openclaw-extensions tests run in their own repo
# (https://github.com/romainsantoli-web/mcp-openclaw)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install firm-cli
        working-directory: firm-cli
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: firm-cli
        run: ruff check firm_cli/ tests/

      - name: Test
        working-directory: firm-cli
        run: python -m pytest tests/ -v
