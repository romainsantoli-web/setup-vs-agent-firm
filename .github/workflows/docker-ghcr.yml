# Validate Docker Compose and build ecosystem images
# Note: mcp-openclaw-extensions Docker image is built from its own repo
# (https://github.com/romainsantoli-web/mcp-openclaw)
name: Docker GHCR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify compose file is valid
        run: docker compose config -q
