# Docker Compose — Firm Ecosystem Stack
# Starts both MCP servers side-by-side for E2E development/demo
#
# Usage:
#   docker compose up -d
#   docker compose logs -f
#   docker compose down

services:
  memory-os-ai:
    image: roamino/memory-os-ai:latest
    container_name: memory-os-ai
    ports:
      - "8765:8765"
    environment:
      - MEMORY_CACHE_DIR=/data
      - MEMORY_MODEL=all-MiniLM-L6-v2
    volumes:
      - memory-data:/data
      - ./workspace:/workspace:ro
    command: ["memory-os-ai", "--sse"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8765/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  mcp-openclaw:
    image: ghcr.io/romainsantoli-web/mcp-openclaw:latest
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        RUN pip install --no-cache-dir mcp-openclaw-extensions
        EXPOSE 8012
        CMD ["python", "-m", "src.main"]
    container_name: mcp-openclaw
    ports:
      - "8012:8012"
    environment:
      - MCP_EXT_HOST=0.0.0.0
      - MCP_EXT_PORT=8012
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8012/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  memory-data:
