[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firm-cli"
version = "1.0.0"
description = "One command to create, start, and manage AI agent firms — inter-session Hebbian memory included"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Romain Santoli", email = "romainsantoli@gmail.com"},
]
keywords = [
    "mcp", "ai-agents", "firm", "openclaw", "hebbian-memory",
    "inter-session-memory", "copilot", "claude-code", "a2a-protocol",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
    "Typing :: Typed",
]
dependencies = [
    "rich>=13.7.0",
]

[project.optional-dependencies]
full = [
    "mcp-openclaw-extensions>=3.3.0",
    "memory-os-ai>=3.0.0",
]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
firm = "firm_cli.main:cli"

[project.urls]
Homepage = "https://github.com/romainsantoli-web/firm-ecosystem"
Documentation = "https://github.com/romainsantoli-web/firm-ecosystem"
Repository = "https://github.com/romainsantoli-web/setup-vs-agent-firm"
Issues = "https://github.com/romainsantoli-web/firm-ecosystem/issues"

[tool.setuptools.packages.find]
include = ["firm_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
