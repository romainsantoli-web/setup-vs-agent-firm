{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "firm-ecosystem.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "firm-ecosystem.name" . }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{- if eq .service "mcp" }}
                name: {{ include "firm-ecosystem.fullname" $ }}-mcp
                port:
                  number: {{ $.Values.mcpServer.port }}
                {{- else }}
                name: {{ include "firm-ecosystem.fullname" $ }}-memory
                port:
                  number: {{ $.Values.memoryServer.port }}
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
