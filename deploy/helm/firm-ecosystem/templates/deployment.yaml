apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "firm-ecosystem.fullname" . }}-mcp
  labels:
    app.kubernetes.io/name: {{ include "firm-ecosystem.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mcp-server
spec:
  replicas: {{ .Values.mcpServer.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "firm-ecosystem.name" . }}
      app.kubernetes.io/component: mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "firm-ecosystem.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: mcp-server
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "firm-ecosystem.serviceAccountName" . }}
      {{- end }}
      containers:
        - name: mcp-server
          image: "{{ .Values.mcpServer.image.repository }}:{{ .Values.mcpServer.image.tag }}"
          imagePullPolicy: {{ .Values.mcpServer.image.pullPolicy }}
          ports:
            - name: mcp
              containerPort: {{ .Values.mcpServer.port }}
              protocol: TCP
          env:
            - name: MCP_EXT_HOST
              value: "0.0.0.0"
            - name: MCP_EXT_PORT
              value: {{ .Values.mcpServer.port | quote }}
            {{- range $key, $value := .Values.mcpServer.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with .Values.mcpServer.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.mcpServer.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.mcpServer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- if .Values.memoryServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "firm-ecosystem.fullname" . }}-memory
  labels:
    app.kubernetes.io/name: {{ include "firm-ecosystem.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: memory-server
spec:
  replicas: {{ .Values.memoryServer.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "firm-ecosystem.name" . }}
      app.kubernetes.io/component: memory-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "firm-ecosystem.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: memory-server
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: memory-server
          image: "{{ .Values.memoryServer.image.repository }}:{{ .Values.memoryServer.image.tag }}"
          imagePullPolicy: {{ .Values.memoryServer.image.pullPolicy }}
          ports:
            - name: memory
              containerPort: {{ .Values.memoryServer.port }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.memoryServer.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with .Values.memoryServer.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.memoryServer.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.memoryServer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: memory-data
              mountPath: /data
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: memory-data
          persistentVolumeClaim:
            claimName: {{ include "firm-ecosystem.fullname" . }}-memory-data
      {{- end }}
{{- end }}
