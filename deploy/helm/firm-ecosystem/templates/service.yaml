apiVersion: v1
kind: Service
metadata:
  name: {{ include "firm-ecosystem.fullname" . }}-mcp
  labels:
    app.kubernetes.io/name: {{ include "firm-ecosystem.name" . }}
    app.kubernetes.io/component: mcp-server
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.mcpServer.port }}
      targetPort: mcp
      protocol: TCP
      name: mcp
  selector:
    app.kubernetes.io/name: {{ include "firm-ecosystem.name" . }}
    app.kubernetes.io/component: mcp-server
---
{{- if .Values.memoryServer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "firm-ecosystem.fullname" . }}-memory
  labels:
    app.kubernetes.io/name: {{ include "firm-ecosystem.name" . }}
    app.kubernetes.io/component: memory-server
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.memoryServer.port }}
      targetPort: memory
      protocol: TCP
      name: memory
  selector:
    app.kubernetes.io/name: {{ include "firm-ecosystem.name" . }}
    app.kubernetes.io/component: memory-server
{{- end }}
